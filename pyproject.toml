[project]
name = "misery-adv-analysis"
version = "0.1.0"
description = "Data analysis and visualization of ADV/ADCP field data (Sea Lamprey Barrier Project, Misery site)"
authors = [{ email = "ehsan010@umn.edu" }]
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy (>=2.0,<3.0)",
    "pandas (>=2.2,<3.0)",
    "matplotlib (>=3.9,<4.0)",
    "scipy (>=1.18.1,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "misery", from = "src" }]

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
